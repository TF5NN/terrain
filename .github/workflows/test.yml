# Runs the checks on every push: the horizon calculation against reference
# horizons made from the 10 m data, the map grid, and the tile files.
name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
